<!DOCTYPE html>
<html lang="ur">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOLY QURAN WITH URDU TARJUMA</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f5ed;
    color: #173d2b;
}

header {
    background: #12452f;
    color: white;
    text-align: center;
    padding: 35px 15px;
}

header h1 {
    font-size: 30px;
}

header p {
    color: #e7d6a1;
}

.menu {
    text-align: center;
    padding: 25px;
    background: white;
}

select, button {
    padding: 12px;
    font-size: 17px;
    border-radius: 8px;
    border: 1px solid #b99b52;
}

button {
    background: #12452f;
    color: white;
    cursor: pointer;
}

#status {
    text-align: center;
    padding: 15px;
}

#quran {
    max-width: 950px;
    margin: auto;
    padding: 15px;
}

.ayah {
    background: white;
    padding: 25px;
    margin-bottom: 18px;
    border-radius: 12px;
    border: 1px solid #ded5b8;
}

.arabic {
    font-family: 'Amiri', serif;
    font-size: 30px;
    line-height: 2.2;
    text-align: right;
    direction: rtl;
    color: #123e2a;
}

.urdu {
    font-family: 'Noto Nastaliq Urdu', serif;
    font-size: 21px;
    line-height: 2.5;
    text-align: right;
    direction: rtl;
    color: #444;
    margin-top: 20px;
}

.ayah-number {
    color: #94742c;
    font-size: 14px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
}

footer {
    background: #12452f;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 30px;
}

</style>
</head>

<body>

<header>
    <h1>القرآن الكريم</h1>
    <h1>HOLY QURAN</h1>
    <p>Complete Quran with Urdu Translation</p>
    <p>تمام 30 پارے اردو ترجمے کے ساتھ</p>
</header>

<div class="menu">

    <h2>اپنا پارہ منتخب کریں</h2>

    <select id="para">
        <option value="1">پارہ 1</option>
        <option value="2">پارہ 2</option>
        <option value="3">پارہ 3</option>
        <option value="4">پارہ 4</option>
        <option value="5">پارہ 5</option>
        <option value="6">پارہ 6</option>
        <option value="7">پارہ 7</option>
        <option value="8">پارہ 8</option>
        <option value="9">پارہ 9</option>
        <option value="10">پارہ 10</option>
        <option value="11">پارہ 11</option>
        <option value="12">پارہ 12</option>
        <option value="13">پارہ 13</option>
        <option value="14">پارہ 14</option>
        <option value="15">پارہ 15</option>
        <option value="16">پارہ 16</option>
        <option value="17">پارہ 17</option>
        <option value="18">پارہ 18</option>
        <option value="19">پارہ 19</option>
        <option value="20">پارہ 20</option>
        <option value="21">پارہ 21</option>
        <option value="22">پارہ 22</option>
        <option value="23">پارہ 23</option>
        <option value="24">پارہ 24</option>
        <option value="25">پارہ 25</option>
        <option value="26">پارہ 26</option>
        <option value="27">پارہ 27</option>
        <option value="28">پارہ 28</option>
        <option value="29">پارہ 29</option>
        <option value="30">پارہ 30</option>
    </select>

    <button onclick="loadQuran()">پارہ کھولیں</button>

</div>

<h2 id="heading" style="text-align:center;">
    قرآن پاک
</h2>

<div id="status">
    اپنا پارہ منتخب کریں۔
</div>

<div id="quran"></div>

<footer>
    <p>HOLY QURAN WITH URDU TRANSLATION</p>
    <p>اللہ تعالیٰ ہمیں قرآن پاک پڑھنے اور سمجھنے کی توفیق عطا فرمائے۔ آمین</p>
</footer>

<script>

async function loadQuran() {

    const para = document.getElementById("para").value;

    const status = document.getElementById("status");
    const quran = document.getElementById("quran");
    const heading = document.getElementById("heading");

    quran.replaceChildren();

    heading.textContent = "پارہ نمبر " + para;

    status.textContent = "قرآن پاک لوڈ ہو رہا ہے، براہ کرم انتظار کریں...";

    try {

        const arabicURL =
        "https://api.alquran.cloud/v1/juz/" +
        para + "/quran-uthmani";

        const urduURL =
        "https://api.alquran.cloud/v1/juz/" +
        para + "/ur.jalandhry";

        const responses = await Promise.all([
            fetch(arabicURL),
            fetch(urduURL)
        ]);

        if (!responses[0].ok || !responses[1].ok) {
            throw new Error("API connection failed");
        }

        const arabicData = await responses[0].json();
        const urduData = await responses[1].json();

        if (arabicData.code !== 200 || urduData.code !== 200) {
            throw new Error("Quran data unavailable");
        }

        const arabicAyahs = arabicData.data.ayahs;
        const urduAyahs = urduData.data.ayahs;

        if (arabicAyahs.length !== urduAyahs.length) {
            throw new Error("Ayah count does not match");
        }

        status.textContent =
        "پارہ نمبر " + para + " کامیابی سے لوڈ ہوگیا۔";

        arabicAyahs.forEach((ayah, index) => {

            const translation = urduAyahs[index];

            const card = document.createElement("div");
            card.className = "ayah";

            const number = document.createElement("div");
            number.className = "ayah-number";

            number.textContent =
            ayah.surah.englishName +
            " | Surah " + ayah.surah.number +
            " | Ayat " + ayah.numberInSurah;

            const arabic = document.createElement("div");
            arabic.className = "arabic";
            arabic.textContent = ayah.text;

            const urdu = document.createElement("div");
            urdu.className = "urdu";
            urdu.textContent = translation.text;

            card.appendChild(number);
            card.appendChild(arabic);
            card.appendChild(urdu);

            quran.appendChild(card);

        });

    }

    catch(error) {

        status.textContent =
        "معذرت! قرآن کا ڈیٹا لوڈ نہیں ہو سکا۔ انٹرنیٹ چیک کریں یا کچھ دیر بعد دوبارہ کوشش کریں۔";

        console.error(error);

    }

}

</script>

</body>
</html>
